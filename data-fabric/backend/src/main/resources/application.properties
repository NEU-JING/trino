server.port=8001
spring.application.name=data-fabric-backend

# Application support database (overridden per environment)
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5432/datafabric}
spring.datasource.username=${APP_DB_USER:postgres}
spring.datasource.password=${APP_DB_PASSWORD:postgres}

# Create/upgrade the platform schema on startup (idempotent, IF NOT EXISTS)
spring.sql.init.mode=always

# Trino query engine
data-fabric.trino.url=${TRINO_URL:http://localhost:8080}
data-fabric.trino.user=${TRINO_SERVICE_USER:trino_service}

# Query execution limits
data-fabric.query.max-rows=${QUERY_MAX_ROWS:10000}
data-fabric.query.timeout=${QUERY_TIMEOUT:30s}
data-fabric.query.threads=${QUERY_THREADS:4}

# Bootstrap local accounts (prototype: first run only; change passwords in real use)
data-fabric.bootstrap.enabled=${BOOTSTRAP_USERS:true}
data-fabric.bootstrap.operator.username=${BOOTSTRAP_OPERATOR_USER:admin}
data-fabric.bootstrap.operator.password=${BOOTSTRAP_OPERATOR_PASSWORD:admin}
data-fabric.bootstrap.query.username=${BOOTSTRAP_QUERY_USER:viewer}
data-fabric.bootstrap.query.password=${BOOTSTRAP_QUERY_PASSWORD:viewer}
