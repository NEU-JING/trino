spring.datasource.url=jdbc:h2:mem:datafabric;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always

data-fabric.trino.url=http://localhost:8080
data-fabric.trino.user=trino_service

data-fabric.bootstrap.enabled=true
data-fabric.bootstrap.operator.username=admin
data-fabric.bootstrap.operator.password=admin
data-fabric.bootstrap.query.username=viewer
data-fabric.bootstrap.query.password=viewer
